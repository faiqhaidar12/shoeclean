[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 120
preDeployCommand = "sh -lc 'php artisan migrate --force && php artisan db:seed --class=Database\\\\Seeders\\\\RoleSeeder --force'"
startCommand = "sh -lc 'php artisan storage:link || true; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'"
